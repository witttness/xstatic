version: '3.9'

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: extatic
      POSTGRES_PASSWORD: extatic
      POSTGRES_DB: extatic
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U extatic"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0"

  api:
    build:
      context: .
      dockerfile: src/Extatic.Api/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=extatic;Username=extatic;Password=extatic
      - Storage__ConnectionString=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tiqIzA==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
      - Jwt__Key=dev-secret-key-minimum-32-chars-long!!
      - Jwt__Issuer=extatic-dev
      - Jwt__Audience=extatic-client
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_started

  # Local OIDC identity provider. Exposes a static user: dev@extatic.local / password
  dex:
    image: dexidp/dex:v2.41.1
    ports:
      - "5556:5556"
    volumes:
      - ./infra/oauth2-proxy/dex-config.yaml:/etc/dex/config.yaml:ro
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5556/dex/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Sits in front of the Angular dev server on :4180. Handles login via Dex and injects
  # X-Forwarded-User / X-Forwarded-Email headers on every proxied request.
  # Auth flow: Browser → :4180 (oauth2-proxy) → :4200 (ng serve) → proxy.conf.json → :5001 (API)
  # The headers injected here are carried through by the Angular dev proxy to the API.
  # Dashboard → http://localhost:4180  (authenticated entry point)
  # API direct → http://localhost:5001 (unauthenticated, useful for Client API / curl)
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.14.3
    ports:
      - "4180:4180"
    environment:
      - OAUTH2_PROXY_PROVIDER=oidc
      # Dex is resolved by container name internally; issuer URL uses localhost because
      # that is what Dex embeds in tokens (browser must also reach it for the redirect).
      - OAUTH2_PROXY_OIDC_ISSUER_URL=http://dex:5556/dex
      # Skip issuer check: the token issuer is http://localhost:5556/dex but the proxy
      # discovers config from http://dex:5556/dex — safe for local dev only.
      - OAUTH2_PROXY_INSECURE_OIDC_SKIP_ISSUER_VERIFICATION=true
      - OAUTH2_PROXY_CLIENT_ID=oauth2-proxy
      - OAUTH2_PROXY_CLIENT_SECRET=oauth2-proxy-secret
      # 32-byte base64 cookie secret — local dev only, regenerate for any other environment
      # with: openssl rand -base64 32
      - OAUTH2_PROXY_COOKIE_SECRET=c2VjcmV0Y2hhbmdlbWVpbnByb2R1Y3Rpb24xMjM0NTY=
      # Upstream is the Angular dev server. All authenticated requests are forwarded here;
      # proxy.conf.json then routes API calls onward to the .NET API on :5001.
      - OAUTH2_PROXY_UPSTREAMS=http://host.docker.internal:4200
      - OAUTH2_PROXY_EMAIL_DOMAINS=*
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      - OAUTH2_PROXY_REDIRECT_URL=http://localhost:4180/oauth2/callback
      - OAUTH2_PROXY_SKIP_PROVIDER_BUTTON=true
      - OAUTH2_PROXY_PASS_USER_HEADERS=true
      - OAUTH2_PROXY_SET_XAUTHREQUEST=true
      - OAUTH2_PROXY_COOKIE_SECURE=false
      - OAUTH2_PROXY_CODE_CHALLENGE_METHOD=S256
      - OAUTH2_PROXY_DEBUG=true
    depends_on:
      dex:
        condition: service_healthy

volumes:
  postgres_data:
