# Dex — local OIDC identity provider for development only.
# Exposes a static test user: dev@extatic.local / password
issuer: http://dex:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true

staticClients:
  - id: oauth2-proxy
    redirectURIs:
      - http://localhost:4180/oauth2/callback
    name: OAuth2 Proxy
    secret: oauth2-proxy-secret

enablePasswordDB: true
staticPasswords:
  - email: dev@extatic.local
    # bcrypt hash of "abc123" — local dev only, never use in production
    hash: "$2a$10$E2Ivym5ciRuYBouBP76Ti.lPtffPx0h0BqmH717R4aYi0ssqdd88S"
    username: dev
    userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"
